<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Xué Yuán 学园</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout : barre latérale encre (desktop) / barre d'onglets en bas (mobile) ; accueil en mosaïque ;
   chaque section a sa couleur, ses glyphes au pinceau ; les tons du pinyin sont codés en couleur */
:root{
  --bg:#F2F2F7; --surface:#FFFFFF; --sunk:#E8E8F0; --ink:#15151F; --muted:#626378; --line:#E1E1EA;
  --shadow:0 1px 2px rgba(21,21,40,.05), 0 12px 32px -18px rgba(21,21,40,.22);
  --side:#15151F; --side-ink:#F3F3F8; --side-muted:#9A9AB0; --side-hover:#24242F;
  --teal:#00A88F; --teal-ink:#04201B; --verm:#D63A20; --verm-ink:#FFFFFF; --indigo:#4C55F5; --indigo-ink:#FFFFFF;
  --plum:#9A3DBA; --plum-ink:#FFFFFF; --gold:#FFB224; --gold-ink:#2A1A00; --coral:#FF6F59; --coral-ink:#2B0A04;
  --bamboo:#2DB55D; --bamboo-ink:#04210F; --rose:#C8326A; --rose-ink:#FFFFFF; --bronze:#9A5716; --bronze-ink:#FFFFFF;
  --t1:#A84600; --t2:#006E52; --t3:#005D96; --t4:#993A77; --t5:#5D5F6E;
  --good:#1E9440; --bad:#C0153D; --outline:#D4D4E0;
  --f-display:"Unbounded", "Avenir Next", system-ui, sans-serif;
  --f-body:"Figtree", "Helvetica Neue", system-ui, sans-serif;
  --f-han:"Noto Serif SC", "Songti SC", "STSong", serif;
  --f-brush:"Ma Shan Zheng", "Kaiti SC", "STKaiti", serif;
  --r:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0F16; --surface:#1A1A24; --sunk:#0A0A10; --ink:#EDEDF5; --muted:#A3A3B8; --line:#2B2B38;
  --shadow:0 0 0 1px #2B2B38;
  --side:#0A0A10; --side-hover:#1E1E29;
  --teal:#2FD1B5; --teal-ink:#05201B; --verm:#FF6A52; --verm-ink:#1F0703; --indigo:#8C93FF; --indigo-ink:#0C0F33;
  --plum:#D687F2; --plum-ink:#250A2E; --gold:#FFC54D; --gold-ink:#2A1A00; --coral:#FF8A77; --coral-ink:#2B0A04;
  --bamboo:#55D687; --bamboo-ink:#04210F; --rose:#FF7BA6; --rose-ink:#2B0614; --bronze:#E6A15F; --bronze-ink:#2A1503;
  --t1:#FF9A4D; --t2:#3DD6AE; --t3:#62B8FF; --t4:#F29BCF; --t5:#A0A2B2;
  --good:#5DD37A; --bad:#FF7A93; --outline:#3C3C4E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F16; --surface:#1A1A24; --sunk:#0A0A10; --ink:#EDEDF5; --muted:#A3A3B8; --line:#2B2B38;
  --shadow:0 0 0 1px #2B2B38;
  --side:#0A0A10; --side-hover:#1E1E29;
  --teal:#2FD1B5; --teal-ink:#05201B; --verm:#FF6A52; --verm-ink:#1F0703; --indigo:#8C93FF; --indigo-ink:#0C0F33;
  --plum:#D687F2; --plum-ink:#250A2E; --gold:#FFC54D; --gold-ink:#2A1A00; --coral:#FF8A77; --coral-ink:#2B0A04;
  --bamboo:#55D687; --bamboo-ink:#04210F; --rose:#FF7BA6; --rose-ink:#2B0614; --bronze:#E6A15F; --bronze-ink:#2A1503;
  --t1:#FF9A4D; --t2:#3DD6AE; --t3:#62B8FF; --t4:#F29BCF; --t5:#A0A2B2;
  --good:#5DD37A; --bad:#FF7A93; --outline:#3C3C4E; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.02em}
h1{font-size:clamp(1.7rem,3.4vw,2.6rem)}
h2{font-size:1.15rem}
h3{font-size:1rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px;border-radius:8px}
a{color:var(--c-text,var(--indigo))}
.han{font-family:var(--f-han);font-weight:500}
.label{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.ttl{font:600 1rem/1.25 var(--f-display);letter-spacing:-.01em}
body:not(.notone) .t1{color:var(--t1)} body:not(.notone) .t2{color:var(--t2)} body:not(.notone) .t3{color:var(--t3)} body:not(.notone) .t4{color:var(--t4)} body:not(.notone) .t5{color:var(--t5)}
/* Sur un fond de couleur plein, une couleur de ton serait illisible : le texte garde la couleur du bloc (le soulignement « tons + traits » reste) */
:is(.b-word,.b-hero,.og-new,.fam-ph,.type,.done-tag,.lang,.ch[aria-pressed="true"],.chip[aria-pressed="true"],.rad[aria-pressed="true"],.steps-dots .cur) :is(.t1,.t2,.t3,.t4,.t5){color:inherit!important}

/* ---------- Coquille : barre latérale + contenu ---------- */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:22px;padding:26px 18px 22px max(18px,env(safe-area-inset-left,0px));overflow-y:auto}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;padding:0 6px}
.logo-mark{width:44px;height:44px;flex:none;border-radius:14px;background:var(--verm);color:#fff;display:grid;place-items:center;font:30px/1 var(--f-brush);transform:rotate(-6deg);box-shadow:0 6px 18px -6px var(--verm)}
.logo b{display:block;font:700 1.15rem/1 var(--f-display);letter-spacing:-.02em}
.logo small{display:block;font:500 .78rem var(--f-han);color:var(--side-muted);margin-top:4px;letter-spacing:.3em}
.side nav{display:flex;flex-direction:column;gap:2px}
.navlink{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;text-decoration:none;color:var(--side-muted);font-weight:600;font-size:.95rem;transition:background .15s,color .15s}
.navlink .g{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;font:1.25rem/1 var(--f-brush);background:var(--side-hover);color:var(--c);transition:background .15s,color .15s}
.navlink:hover{background:var(--side-hover);color:var(--side-ink)}
.navlink[aria-current="page"]{background:var(--side-hover);color:var(--side-ink)}
.navlink[aria-current="page"] .g{background:var(--c);color:var(--c-ink)}
.me{margin-top:auto;background:var(--side-hover);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.me-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.me-num{font:600 1.35rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.me .label{color:var(--side-muted)}
.lvl-badge{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:var(--gold-ink);font:700 .78rem var(--f-display);padding:5px 10px;border-radius:999px}

main{min-width:0;padding-block:40px 80px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.page{max-width:1080px;margin:0 auto}

/* Mobile : barre du haut + onglets en bas */
.mtop,.bottom,.sheet{display:none}
@media (max-width:900px){
  .shell{display:block}
  .side{display:none}
  main{padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mtop{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;align-items:center;gap:10px;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .mtop .logo{padding:0;color:var(--ink)}
  .mtop .logo-mark{width:36px;height:36px;font-size:24px;border-radius:11px}
  .mtop .logo b{font-size:1rem;white-space:nowrap}
  .mtop .pills .pill{padding:6px 9px}
  .mtop .pills{margin-left:auto;display:flex;gap:6px}
  .bottom{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;z-index:20;left:0;right:0;bottom:0;background:var(--side);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-radius:22px 22px 0 0}
  .bottom a,.bottom button{appearance:none;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;text-decoration:none;color:var(--side-muted);font:600 .68rem var(--f-body);cursor:pointer;border-radius:14px}
  .bottom .g{width:40px;height:30px;border-radius:10px;display:grid;place-items:center;font:1.3rem/1 var(--f-brush);color:var(--c)}
  .bottom [aria-current="page"]{color:var(--side-ink)}
  .bottom [aria-current="page"] .g{background:var(--c);color:var(--c-ink)}
  .sheet{position:fixed;inset:0;z-index:25;background:rgba(10,10,16,.45);align-items:flex-end}
  .sheet.open{display:flex}
  .sheet-in{width:100%;background:var(--side);color:var(--side-ink);border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .sheet-in .navlink{background:var(--side-hover);color:var(--side-ink)}
}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:.84rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .fire{color:var(--coral)}

/* ---------- En-tête de section ---------- */
.view{--c:var(--teal);--c-ink:var(--teal-ink);--c-soft:color-mix(in oklab,var(--c) 14%,var(--surface));--c-text:color-mix(in oklab,var(--c) 50%,var(--ink));display:flex;flex-direction:column;gap:26px;animation:rise .35s ease-out both}
@keyframes rise{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
.head{position:relative;display:flex;flex-direction:column;gap:10px;padding-top:6px;padding-right:min(26%,220px);min-height:120px}
.head::after{content:attr(data-g);position:absolute;right:0;top:-18px;font:10.5rem/1 var(--f-brush);color:transparent;-webkit-text-stroke:1.6px var(--c);opacity:.55;pointer-events:none;z-index:0}
.head>*{position:relative;z-index:1}
.head .label{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;color:var(--c-text);background:var(--c-soft);padding:6px 12px;border-radius:999px}
.head p{color:var(--muted);max-width:60ch;font-size:1.02rem}
@media (max-width:900px){.head{padding-right:84px;min-height:0}.head::after{font-size:6.5rem;top:-6px;opacity:.4}}

/* ---------- Briques ---------- */
.card{background:var(--surface);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);border:0}
.card.tint,.tint{--c-soft:color-mix(in oklab,var(--c) 14%,var(--surface));--c-text:color-mix(in oklab,var(--c) 50%,var(--ink));background:var(--c-soft);box-shadow:none}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}

.btn{appearance:none;border:0;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);transition:transform .12s,box-shadow .15s,filter .15s}
.btn:hover{box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--c,var(--indigo));color:var(--c-ink,#fff);box-shadow:none}
.btn.primary:hover{filter:brightness(1.06) saturate(1.1)}
.btn.inkbtn{background:var(--ink);color:var(--surface);box-shadow:none}
.btn.accent{background:var(--verm);color:var(--verm-ink);box-shadow:none}
.btn.ghost{box-shadow:none;background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.btn.ghost:hover{color:var(--ink);background:var(--sunk)}
.btn.small{padding:7px 13px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.speak{appearance:none;border:0;background:color-mix(in oklab,var(--c,var(--indigo)) 16%,var(--surface));color:var(--c-text,var(--indigo));width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;cursor:pointer;flex:none;transition:transform .12s}
.speak:hover{background:var(--c,var(--indigo));color:var(--c-ink,#fff)}
.speak:active{transform:scale(.92)}
.speak svg{width:18px;height:18px}

/* ---------- Accueil en mosaïque ---------- */
.hello{display:flex;flex-direction:column;gap:6px}
.hello h1 .han{font-family:var(--f-brush);font-weight:400;color:var(--verm);font-size:1.15em;margin-right:.15em}
.bento{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;grid-auto-rows:minmax(170px,auto)}
.b{border-radius:26px;padding:22px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:10px;min-width:0;background:var(--surface);box-shadow:var(--shadow)}
.b-hero{grid-column:span 2;grid-row:span 2;background:var(--c);color:var(--c-ink);box-shadow:none;justify-content:flex-end;padding:28px;min-height:340px}
.b-hero .big{position:absolute;right:-10px;top:-24px;font:700 13rem/1 var(--f-han);opacity:.16;pointer-events:none}
.b-hero .label{color:inherit}
.b-hero h2{font-size:clamp(1.5rem,2.6vw,2.1rem)}
.b-hero .preview{font:500 1.35rem var(--f-han);letter-spacing:.12em;opacity:.85}
.b-hero .btn{align-self:flex-start;background:var(--ink);color:var(--surface);box-shadow:none;margin-top:6px}
.b-goal{align-items:center;justify-content:center;text-align:center}
.ring{--p:0;width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--teal) calc(var(--p)*1%),var(--sunk) 0);display:grid;place-items:center}
.ring>div{width:92px;height:92px;border-radius:50%;background:var(--surface);display:grid;place-items:center;line-height:1.05}
.ring strong{font:600 1.6rem var(--f-display);font-variant-numeric:tabular-nums}
.ring span{font-size:.72rem;color:var(--muted)}
.b-streak{background:var(--coral);color:var(--coral-ink);box-shadow:none}
.b-streak .num{font:700 3rem/1 var(--f-display)}
.b-streak .label{color:inherit}
.dots{display:flex;gap:5px;margin-top:auto}
.dots span{flex:1;height:26px;border-radius:8px;background:color-mix(in oklab,var(--coral-ink) 14%,transparent);display:grid;place-items:center;font-size:.62rem;font-weight:700}
.dots span.on{background:var(--coral-ink);color:var(--coral)}
.b-word{grid-column:span 2;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:20px;background:var(--gold);color:var(--gold-ink);box-shadow:none;--c:var(--gold-ink);--c-ink:var(--gold);--c-text:var(--gold-ink)}
.b-word .big{font:500 4.4rem/1 var(--f-han)}
.b-word .label{color:inherit}
.b-word .py{font:600 1.25rem var(--f-display)}
.b-word .speak{background:var(--gold-ink);color:var(--gold)}
.w2{grid-column:span 2} .w4{grid-column:span 4}
.b-mini .num{font:600 2.4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.b-mini .btn{margin-top:auto;align-self:flex-start}
.b-test{background:var(--indigo);color:var(--indigo-ink);box-shadow:none}
.b-test .label{color:inherit}
.b-test .btn{background:var(--indigo-ink);color:var(--indigo);box-shadow:none}
.b-write{grid-column:span 2;display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.tzg{width:104px;height:104px;flex:none;border:2px solid var(--c);border-radius:10px;display:grid;place-items:center;font-size:3.8rem;line-height:1;color:var(--ink);background-image:linear-gradient(to right,transparent calc(50% - .5px),color-mix(in oklab,var(--c) 45%,transparent) calc(50% - .5px) calc(50% + .5px),transparent 0),linear-gradient(to bottom,transparent calc(50% - .5px),color-mix(in oklab,var(--c) 45%,transparent) calc(50% - .5px) calc(50% + .5px),transparent 0);background-color:var(--surface)}
.shortcuts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sc{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);transition:transform .15s}
.sc:hover{transform:translateY(-3px)}
.sc .g{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:var(--c-ink);font:1.7rem/1 var(--f-brush)}
.sc strong{font:600 .92rem var(--f-display)}
.sc span{font-size:.8rem;color:var(--muted)}

@media (max-width:900px){
  .bento{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;grid-auto-rows:auto}
  .w4{grid-column:span 2}
  .b{padding:18px;border-radius:22px}
  .b-hero{min-height:260px;padding:22px}
  .b-hero .big{font-size:9.5rem}
  .b-word{grid-template-columns:auto 1fr;gap:14px}
  .b-word .big{font-size:3.2rem}
  .b-word .speak{grid-column:1/-1;justify-self:start}
  .shortcuts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
}

/* ---------- Leçons ---------- */
.lvl-tabs{display:inline-flex;gap:4px;flex-wrap:wrap;background:var(--surface);box-shadow:var(--shadow);padding:5px;border-radius:999px;align-self:flex-start}
.chip{appearance:none;border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:700;font-size:.9rem;cursor:pointer;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--c);color:var(--c-ink)}
.lesson{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit;border:0;transition:transform .15s}
.lesson:hover{transform:translateY(-3px)}
.lesson .label{color:var(--c-text)}
.lesson .han-row{font-family:var(--f-han);font-size:1.45rem;letter-spacing:.08em;color:var(--c-text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.done-tag{align-self:flex-start;font-size:.76rem;font-weight:700;color:var(--c-ink);background:var(--c);padding:3px 10px;border-radius:999px}
.wordlist{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.word{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;padding:14px 16px}
.word .h{font-family:var(--f-han);font-size:2rem;line-height:1.1;white-space:nowrap}
.word .h.l{font-size:1.6rem}
.word .h.xl{font-size:1.3rem}
.word .p,.word .f{overflow-wrap:anywhere}
.word .p{font-weight:700}
.word .f{font-size:.92rem;color:var(--muted)}
.word .m{grid-column:1/-1;font-size:.86rem;border-top:1px dashed var(--line);padding-top:8px}
.dialog{display:flex;flex-direction:column;gap:14px}
.line{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.line .zh{font-family:var(--f-han);font-size:1.3rem}
.ex{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start}
.ex .zh{font:500 1.15rem/1.5 var(--f-han)}
.ex mark{background:var(--c-soft,var(--sunk));color:inherit;border-radius:4px;padding:0 2px;box-shadow:inset 0 -2px 0 var(--c,var(--teal))}
.ex .ex-py{font-weight:600;font-size:.9rem}
.ex .muted{font-size:.9rem}
.tipbox{background:var(--gold);color:var(--gold-ink);border-radius:20px;padding:18px 20px}
.tipbox .label{color:inherit;opacity:.7}

/* ---------- Quiz ---------- */
.quiz{max-width:660px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.progress{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .3s}
.prompt{background:var(--c-soft);color:var(--ink);box-shadow:inset 0 0 0 2px color-mix(in oklab,var(--c) 40%,transparent);text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 18px;border-radius:28px}
.prompt .label{color:var(--c-text)}
.prompt .h{font-family:var(--f-han);font-size:clamp(3.2rem,12vw,5rem);line-height:1.1}
.prompt .q{font:600 1.05rem/1.4 var(--f-display);max-width:40ch}
.options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{appearance:none;text-align:left;background:var(--surface);border:0;box-shadow:var(--shadow),inset 0 0 0 2px transparent;border-radius:18px;padding:16px;cursor:pointer;font-weight:600;min-height:62px;transition:transform .12s,box-shadow .15s}
.opt.hanopt{font-family:var(--f-han);font-size:1.7rem;text-align:center;font-weight:500}
.opt:hover:not([disabled]){box-shadow:var(--shadow),inset 0 0 0 2px var(--c);transform:translateY(-1px)}
.opt.ok{box-shadow:inset 0 0 0 2px var(--good);background:color-mix(in oklab,var(--good) 16%,var(--surface))}
.opt.ko{box-shadow:inset 0 0 0 2px var(--bad);background:color-mix(in oklab,var(--bad) 14%,var(--surface));animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.opt[disabled]{cursor:default}
.feedback{min-height:1.5em;text-align:center;font-weight:600}
.feedback.ok{color:var(--good)} .feedback.ko{color:var(--bad)}
/* Juste / faux : une icône en plus de la couleur (daltonisme), et un cramoisi bien distinct du vermillon de la marque */
.opt{position:relative}
.opt.ok,.opt.ko{padding-right:44px}
.opt.ok::after,.opt.ko::after{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 .85rem/1 var(--f-body);color:#fff}
.opt.ok::after{content:"✓";background:var(--good)}
.opt.ko::after{content:"✕";background:var(--bad)}
.feedback.ok::before{content:"✓ "} .feedback.ko::before{content:"✕ "}
.errcard::before{content:"✕ À retenir";font:700 .75rem var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--bad)}
.errcard.win::before{content:"✓ Bien joué";color:var(--good)}
.modes{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}

/* ---------- Écriture ---------- */
.atelier{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.pad-wrap{display:flex;flex-direction:column;align-items:center;gap:16px}
.pad{width:min(340px,100%);aspect-ratio:1;max-width:100%;background:var(--surface);border:2.5px solid var(--c);border-radius:10px;position:relative}
.pad svg.grid-bg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pad .target{position:absolute;inset:0}
.charpick{display:flex;flex-wrap:wrap;gap:6px;max-height:420px;overflow:auto;padding:2px}
.cp{appearance:none;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:12px;width:46px;height:46px;font:1.35rem var(--f-han);cursor:pointer}
.cp[aria-pressed="true"]{background:var(--c);color:var(--c-ink)}
.cp.has{box-shadow:inset 0 -4px 0 var(--bamboo),var(--shadow)}

/* ---------- Devinettes, mémo, actus ---------- */
.riddle .q{font:2.1rem/1.3 var(--f-brush);color:var(--c-text)}
.riddle .q.fr{font:600 1.05rem/1.4 var(--f-display)}
.riddle .opts{display:flex;flex-wrap:wrap;gap:8px}
.riddle .opts .opt{font-family:var(--f-han);font-size:1.4rem;font-weight:500;min-width:64px;text-align:center;padding:10px 14px;min-height:0}
.reveal{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:.94rem}
.mnemo{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.mnemo .h{font:2.7rem/1 var(--f-han);color:var(--c-text);width:58px;text-align:center}
.tones{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.search{width:100%;max-width:440px;padding:12px 18px;border:0;box-shadow:var(--shadow);border-radius:999px;background:var(--surface)}
.ai-out{white-space:pre-wrap;background:var(--sunk);border-radius:16px;padding:14px 16px}
.src{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;transition:transform .15s}
.src:hover{transform:translateY(-3px)}
.src .lang{align-self:flex-start;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--c);color:var(--c-ink)}
.culture .h{font:2.2rem/1 var(--f-brush);color:var(--c-text)}
.reading .zh{font:1.3rem/1.9 var(--f-han)}
.reading .py{font-size:.95rem}
details summary{cursor:pointer;font-weight:700}

/* ---------- Objectifs ---------- */
form.settings{display:grid;gap:20px}
.field{display:flex;flex-direction:column;gap:8px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:4px;gap:4px;align-self:flex-start;max-width:100%}
.seg button{appearance:none;border:0;background:transparent;padding:8px 16px;white-space:nowrap;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--c);color:var(--c-ink)}
.days{display:flex;gap:6px;flex-wrap:wrap}
.days button{appearance:none;flex:1 1 0;min-width:34px;max-width:48px;height:44px;border-radius:14px;border:0;background:var(--sunk);font-weight:700;cursor:pointer;color:var(--muted)}
.days button[aria-pressed="true"]{background:var(--c);color:var(--c-ink)}
input[type=range]{width:100%;max-width:440px;accent-color:var(--c)}
input[type=time],select{padding:10px 14px;border:0;box-shadow:inset 0 0 0 1.5px var(--line);border-radius:12px;background:var(--surface)}
.chart{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:180px;padding-top:22px;border-bottom:1px solid var(--line)}
.chart .col{position:relative;height:100%;display:flex;align-items:flex-end;justify-content:center}
.chart .bar{width:min(30px,70%);background:var(--c);border-radius:4px 4px 0 0;min-height:2px}
.chart .bar.under{background:var(--c-soft);outline:1.5px solid var(--c);outline-offset:-1.5px}
.chart .col:hover .tip{opacity:1}
.chart .tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);font-size:.78rem;padding:3px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:2}
.chart .goal{position:absolute;left:0;right:0;border-top:1.5px dashed var(--verm);pointer-events:none}
.chart .goal span{position:absolute;right:0;top:-19px;font-size:.72rem;color:var(--muted);background:var(--surface);padding:0 4px}
.xlabels{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-size:.78rem;color:var(--muted);margin-top:6px}
.xlabels .today{color:var(--ink);font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:11px 20px;border-radius:16px;text-align:center;width:max-content;font-weight:600;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,transform .25s,visibility .25s;z-index:40;max-width:calc(100% - 32px)}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%)}
@media (max-width:900px){.toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}

@media (max-width:900px){
  .atelier{grid-template-columns:1fr}
  .charpick{max-height:none}
}
@media (max-width:560px){
  .sc{padding:14px 12px}
  .sc strong{font-size:.78rem}
  .b-write{grid-template-columns:1fr}
  .options{grid-template-columns:1fr}
  .card{padding:18px}
}
/* ---------- Questionnaire d'accueil ---------- */
body.onb-open{overflow:hidden}
.onb{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.onb-in{max-width:880px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:26px;padding-block:28px 28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.onb-top{display:flex;align-items:center;gap:12px}
.onb-top b{font:700 1.1rem var(--f-display)}
.onb-top .logo-mark{width:40px;height:40px;font-size:27px}
.dotsteps{margin-left:auto;display:flex;gap:6px}
.dotsteps i{width:34px;height:6px;border-radius:9px;background:var(--sunk)}
.dotsteps i.on{background:var(--verm)}
.onb-body{display:flex;flex-direction:column;gap:16px;flex:1}
.onb-body h1{font-size:clamp(1.8rem,4.4vw,3rem)}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
.ch{appearance:none;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px;text-align:left;font-weight:600;cursor:pointer;transition:transform .12s,background .15s}
.ch .g{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;font:1.6rem/1 var(--f-brush);background:color-mix(in oklab,var(--c) 16%,var(--surface));color:color-mix(in oklab,var(--c) 50%,var(--ink))}
.ch:hover{transform:translateY(-2px)}
.ch[aria-pressed="true"]{background:var(--c);color:var(--c-ink)}
.ch[aria-pressed="true"] .g{background:var(--c-ink);color:var(--c)}
.onb .seg.big button{padding:12px 22px;font-size:1rem}
.onb .seg{--c:var(--verm);--c-ink:var(--verm-ink)}
.onb .days,.onb .presets,.onb input[type=range]{--c:var(--verm);--c-ink:var(--verm-ink)}
.tbig{font:600 1.2rem var(--f-display)}
.tbig strong{font-size:3.6rem;color:var(--verm);font-variant-numeric:tabular-nums;margin-right:6px}
.presets{display:flex;flex-wrap:wrap;gap:8px}
.presets .chip{background:var(--surface);box-shadow:var(--shadow)}
.presets .chip[aria-pressed="true"]{background:var(--c,var(--verm));color:var(--c-ink,#fff)}
.onb-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;bottom:0;padding-block:14px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.onb-foot .btn{white-space:nowrap}
.btn.big{padding:15px 28px;font-size:1.05rem;--c:var(--verm);--c-ink:var(--verm-ink)}
.goal-chip{align-self:flex-start;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:.88rem;padding:6px 14px;border-radius:999px;margin-top:4px}
@media (max-width:760px){.choices{grid-template-columns:1fr 1fr}.ch{padding:12px;gap:10px;font-size:.9rem;border-radius:16px}.ch .g{width:38px;height:38px;font-size:1.3rem}}

/* ---------- Chansons ---------- */
.songs{display:flex;flex-direction:column;gap:14px}
.song{display:flex;flex-direction:column;gap:18px}
.song-head{appearance:none;border:0;background:none;padding:0;display:flex;align-items:center;gap:18px;cursor:pointer;color:inherit;font:inherit;text-align:left}
.disc{width:72px;height:72px;flex:none;border-radius:50%;display:grid;place-items:center;font:2rem/1 var(--f-brush);color:var(--c-ink);background:radial-gradient(circle,var(--surface) 0 9%,var(--c) 10% 60%,color-mix(in oklab,var(--c) 70%,var(--ink)) 61% 100%)}
.song.open .disc{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lyrics{display:flex;flex-direction:column;gap:6px}
.lyric{padding:12px 16px;border-radius:16px;transition:background .2s}
.lyric.on{background:var(--c-soft)}
.lyric .zh{font:500 1.7rem/1.4 var(--f-han);letter-spacing:.06em}
.lyric .py{font-weight:600;font-size:.95rem}
.lyric .fr{color:var(--muted);font-size:.92rem}
.kc{display:inline-block;border-radius:8px;transition:transform .12s,background .12s}
.kc.on{background:var(--c);color:var(--c-ink)!important;transform:translateY(-3px) scale(1.12)}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vchip{appearance:none;border:0;background:var(--sunk);border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer}
.vchip small{color:var(--muted);margin-left:4px}
.vchip:hover{background:var(--c-soft)}

/* ---------- Origines ---------- */
.og-detail{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;background:var(--c-soft);box-shadow:none}
.og-vis{display:flex;align-items:center;gap:14px}
.og-old,.og-new{display:flex;flex-direction:column;align-items:center;gap:8px}
.sketch{width:120px;height:120px;color:var(--c-text);background:var(--surface);border-radius:20px;padding:12px}
.og-new .han{width:120px;height:120px;display:grid;place-items:center;background:var(--c);color:var(--c-ink);border-radius:20px;font-size:4.6rem;line-height:1}
.og-arrow{font:600 1.6rem var(--f-display);color:var(--c-text)}
.type{background:var(--c);color:var(--c-ink);font-weight:700;font-size:.82rem;padding:4px 12px;border-radius:999px}
.parts{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.part{min-width:48px;height:48px;padding:0 8px;display:grid;place-items:center;background:var(--surface);border-radius:12px;font-size:1.6rem}
.part.res{background:var(--c);color:var(--c-ink)}
.plus{font:600 1.2rem var(--f-display);color:var(--muted)}
.six{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.og-ex{display:flex;flex-wrap:wrap;gap:6px}
.ogc{appearance:none;border:0;background:var(--surface);border-radius:10px;min-width:40px;height:40px;font:1.3rem var(--f-han);cursor:pointer;transition:transform .12s}
.ogc:hover{transform:translateY(-2px);background:var(--c);color:var(--c-ink)}
.ogc.wide{display:inline-flex;align-items:center;gap:8px;padding:0 12px;height:46px}
.ogc.wide small{font:500 .78rem var(--f-body);color:var(--muted)}
.fams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fam{display:grid;grid-template-columns:110px minmax(0,1fr);gap:16px;align-items:center}
.fam-ph{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;background:var(--c);color:var(--c-ink);border-radius:18px;padding:14px 8px}
.fam-ph .han{font-size:2.8rem;line-height:1}
.fam-ph span:nth-child(2){font-weight:700}
.fam-ph small{font-size:.72rem;opacity:.85}
.fam-m{display:flex;flex-direction:column;gap:4px}
.fam-row{appearance:none;border:0;background:none;display:grid;grid-template-columns:36px 54px auto minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:6px 8px;border-radius:10px;cursor:pointer;font:inherit;color:inherit}
.fam-row:hover{background:var(--c-soft)}
.fam-row .han{font-size:1.5rem}
.fam-row .tag{font-size:.75rem;background:var(--sunk);padding:2px 8px;border-radius:999px;white-space:nowrap}
.fam-row .muted{font-size:.88rem}
.rads{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.rad{appearance:none;border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;text-align:center;transition:transform .12s}
.rad .han{font-size:2rem;line-height:1.1;color:var(--c-text)}
.rad strong{font-size:.8rem}
.rad small{font-size:.7rem;color:var(--muted)}
.rad:hover{transform:translateY(-2px)}
.rad[aria-pressed="true"]{background:var(--c);color:var(--c-ink)}
.rad[aria-pressed="true"] .han,.rad[aria-pressed="true"] small{color:inherit}
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;counter-reset:t}
.timeline li{position:relative;display:flex;flex-direction:column;gap:6px;padding:18px 14px 16px;background:var(--surface);box-shadow:var(--shadow);border-radius:18px;font-size:.86rem}
.timeline li::before{content:"";position:absolute;top:0;left:14px;right:14px;height:4px;border-radius:0 0 4px 4px;background:var(--c);opacity:calc(.35 + var(--i,0) * .13)}
.timeline .when{font:700 .72rem var(--f-display);color:var(--c-text);letter-spacing:.04em}
.timeline .name{font-size:1.5rem}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.pair{appearance:none;border:0;background:var(--sunk);border-radius:14px;padding:10px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;font:inherit;color:inherit}
.pair .han{font-size:1.9rem}
.pair .trad{color:var(--c-text)}
.pair .arrow{color:var(--muted)}
@media (max-width:1100px){.timeline{grid-template-columns:repeat(3,minmax(0,1fr))}.six{grid-template-columns:repeat(2,minmax(0,1fr))}.fams{grid-template-columns:1fr}}
@media (max-width:640px){
  .og-detail{grid-template-columns:1fr}
  .og-vis{justify-content:center}
  .sketch,.og-new .han{width:96px;height:96px}
  .og-new .han{font-size:3.6rem}
  .six{grid-template-columns:1fr}
  .timeline{grid-template-columns:1fr}
  .fam{grid-template-columns:1fr}
  .fam-ph{flex-direction:row;justify-content:center;gap:10px}
  .fam-row{grid-template-columns:32px 50px minmax(0,1fr)}
  .fam-row .tag{display:none}
  .disc{width:56px;height:56px;font-size:1.6rem}
  .lyric .zh{font-size:1.45rem}
}
/* ---------- Pinyin masquable, tons soulignés ---------- */
body.py-tap .pyx{filter:blur(6px);cursor:pointer;transition:filter .2s;user-select:none}
body.py-hide .pyx{visibility:hidden;cursor:pointer;position:relative}
body.py-hide .pyx::after{content:"pinyin";visibility:visible;position:absolute;left:0;top:0;font-size:.75rem;font-weight:700;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:0 6px}
body.py-tap .pyx.revealed,body.py-hide .pyx.revealed{filter:none;visibility:visible}
body.py-hide .pyx.revealed::after{content:none}
body.toneline .t1,body.toneline .t2,body.toneline .t3,body.toneline .t4{text-decoration-line:underline;text-underline-offset:.22em;text-decoration-thickness:2px}
body.toneline .t1{text-decoration-style:solid} body.toneline .t2{text-decoration-style:dashed} body.toneline .t3{text-decoration-style:wavy} body.toneline .t4{text-decoration-style:double}
.pybtn{appearance:none;border:0;background:var(--side);color:var(--side-ink);border-radius:12px;padding:8px 10px;font-weight:700;font-size:.82rem;cursor:pointer}
.st-py-short{border:0;cursor:pointer;color:var(--ink)}
.subnav{display:flex;flex-direction:column;margin:2px 0 8px 56px;gap:1px}
.subnav a{color:var(--side-muted);text-decoration:none;font-size:.86rem;font-weight:600;padding:5px 10px;border-radius:10px}
.subnav a:hover{color:var(--side-ink);background:var(--side-hover)}
.subnav a[aria-current="page"]{color:var(--c);background:var(--side-hover)}

/* ---------- Séance, apprentissage, erreurs ---------- */
.plan{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px;font-size:.95rem}
.plan span{font-weight:500}
.meter{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--teal);border-radius:99px}
.dots span.rest{background:transparent;outline:1.5px dashed color-mix(in oklab,var(--coral-ink) 30%,transparent)}
.seance-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.steps-dots{display:flex;gap:6px;flex-wrap:wrap}
.steps-dots span{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.steps-dots span.cur{background:var(--c);color:var(--c-ink)}
.steps-dots span.done{background:var(--c-soft);color:var(--c-text)}
.intro .big-py{font:600 1.4rem var(--f-display)}
.muted-on{opacity:.85}
.ghost-on{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor;color:inherit}
.tipline{background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:10px 14px;font-size:.92rem}
.tipline .han{font-size:1.2rem;margin-right:6px}
/* Pendant un exercice, sur mobile, la barre du bas disparaît : plus de place, et rien ne cache le bouton « Continuer » */
@media (max-width:900px){
  body.in-flow .bottom{display:none}
  body.in-flow main{padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}

const WORDS = [];
// Chaque sens a son identifiant : le premier garde les caractères seuls (花), les suivants prennent un suffixe (花#2).
// Ainsi 长 cháng / zhǎng, 还 hái / huán, 得 de / děi, 花 « fleur » / « dépenser » ont chacun leur propre fiche de révision,
// et la progression déjà enregistrée sous les caractères seuls reste attachée au premier sens.
const SENSES = {};
for (const lvl of [1,2,3,4]) RAW[lvl].split('\n').forEach(line => {
  const [h,p,f] = line.split('|');
  const n = SENSES[h] = (SENSES[h] || 0) + 1;
  WORDS.push({h, p, f, l: lvl, id: n === 1 ? h : `${h}#${n}`});
});
// W[id] : fiche d'un sens. W[caractères] renvoie donc le premier sens.
const W = {}; WORDS.forEach(w => { W[w.id] = w; });

// HSK 3 et 4 : séries de 20 mots dans l'ordre de la liste officielle (à refondre au lot 6)
for (const lvl of [3,4]) {
  const list = WORDS.filter(w => w.l === lvl);
  for (let i = 0; i < list.length; i += 20) {
    const n = i/20 + 1, ws = list.slice(i, i+20);
    LESSONS.push({id:`${lvl}-${n}`, l:lvl, t:`Série ${n}`, d:`${ws.slice(0,3).map(w=>w.f.split(/[,;]/)[0]).join(', ')}…`, w:ws.map(w=>w.h).join(' '), ws, g:[], tip:''});
  }
}

// ---------- Mélodies (synthèse dans le navigateur) ----------
const NOTE_I = {C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11};
const freq = n => 440 * Math.pow(2, (NOTE_I[n[0]] + 12 * (+n.slice(-1) + 1) - 69) / 12);
let audioCtx = null, playing = null;
function stopSong() {
  if (!playing) return;
  playing.timers.forEach(clearTimeout); playing.nodes.forEach(o => { try { o.stop(); } catch {} });
  $$('.kc.on, .lyric.on').forEach(e => e.classList.remove('on'));
  playing.btn && (playing.btn.innerHTML = playing.label);
  playing = null;
}
function playSong(song, root, btn) {
  if (playing) { const same = playing.song === song; stopSong(); if (same) return; }
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); }
  catch { toast("Le son n'est pas disponible sur ce navigateur."); return; }
  const tune = TUNES[song.tune], beat = 60 / tune.bpm, t0 = audioCtx.currentTime + 0.15;
  const P = playing = {song, timers: [], nodes: [], btn, label: btn.innerHTML};
  btn.innerHTML = '■ Arrêter';
  let t = 0;
  song.lines.forEach((ln, li) => {
    const notes = tune.lines[li % tune.lines.length].split(',').map(x => x.trim().split(' '));
    notes.forEach(([n, b], ni) => {
      const dur = +b * beat, start = t0 + t;
      const o = audioCtx.createOscillator(), o2 = audioCtx.createOscillator(), gn = audioCtx.createGain();
      o.type = 'triangle'; o2.type = 'sine'; o.frequency.value = freq(n); o2.frequency.value = freq(n) * 2;
      const g2 = audioCtx.createGain(); g2.gain.value = 0.18;
      o.connect(gn); o2.connect(g2); g2.connect(gn); gn.connect(audioCtx.destination);
      gn.gain.setValueAtTime(0.0001, start); gn.gain.exponentialRampToValueAtTime(0.32, start + 0.02);
      gn.gain.exponentialRampToValueAtTime(0.0001, start + Math.max(0.12, dur * 0.95));
      o.start(start); o2.start(start); o.stop(start + dur); o2.stop(start + dur); P.nodes.push(o, o2);
      P.timers.push(setTimeout(() => {
        $$('.kc.on', root).forEach(e => e.classList.remove('on'));
        $$('.lyric', root).forEach((e, k) => e.classList.toggle('on', k === li));
        $(`.lyric[data-li="${li}"] .kc[data-ci="${ni}"]`, root)?.classList.add('on');
      }, (start - audioCtx.currentTime) * 1000));
      t += dur;
    });
    t += beat * 0.25;
  });
  P.timers.push(setTimeout(stopSong, (t0 + t - audioCtx.currentTime) * 1000 + 200));
}
async function readSong(song, root, btn) {
  if (!('speechSynthesis' in window)) { toast("L'audio n'est pas disponible sur ce navigateur."); return; }
  if (btn.dataset.reading) { speechSynthesis.cancel(); delete btn.dataset.reading; btn.textContent = 'Lire les paroles'; $$('.lyric', root).forEach(e => e.classList.remove('on')); return; }
  btn.dataset.reading = 1; btn.textContent = '■ Arrêter la lecture';
  for (let i = 0; i < song.lines.length && btn.dataset.reading; i++) {
    $$('.lyric', root).forEach((e, k) => e.classList.toggle('on', k === i));
    await new Promise(res => { const u = new SpeechSynthesisUtterance(song.lines[i][0]); u.lang = 'zh-CN'; if (zhVoice) u.voice = zhVoice; u.rate = S.rate; u.onend = u.onerror = res; speechSynthesis.speak(u); });
  }
  delete btn.dataset.reading; btn.textContent = 'Lire les paroles'; $$('.lyric', root).forEach(e => e.classList.remove('on'));
}
function hskWordsIn(text) {
  const out = [];
  for (let i = 0; i < text.length;) {
    let hit = null;
    for (let n = 4; n >= 1; n--) { const w = W[text.slice(i, i + n)]; if (w) { hit = w; break; } }
    if (hit) { if (!out.includes(hit)) out.push(hit); i += hit.h.length; } else i++;
  }
  return out;
}

const CHUNK = 5;

  if (a.length >= chunksOf(L).length) S.lessons[L.id] = Math.max(S.lessons[L.id] || 0, score);

}
// Priorités de leçons selon les raisons données au questionnaire
const REASON_LESSONS = {voyage: ['1f','1e','1b','2e','2c','2d'], vivre: ['1f','1e','1d','2e','2g'], cuisine: ['1e','2d'], travail: ['1a','1g','1d','2h','2b'], famille: ['1c','2a','1a'], amis: ['1a','1c','2f'], etudes: ['1g','1d','2h'], hsk: [], culture: ['1g','2f'], ecriture: [], defi: [], cerveau: ['1b','2j']};

// Réponse à un QCM : juste → on enchaîne ; faux → on s'arrête, explication et bouton « Continuer »

// ---------- Détective de caractères ----------
const DETECT = FAMILIES.flatMap(f => f.m.map(([c, p, rad, fr]) => ({c, p, rad, fr, fam: f})));
function detective(box, n, onDone) {

    const pyOpts = shuffle([x.p, ...pick(uniqBy(DETECT.filter(y => y.fam !== x.fam), y => normPy(y.p)).filter(y => normPy(y.p) !== normPy(x.p)), 3).map(y => y.p)]);

    $$('#o1 .opt', box).forEach(b => b.addEventListener('click', () => {
      const right = b.dataset.o === x.p; if (right) { got++; score++; }
      $$('#o1 .opt', box).forEach(o => { o.disabled = true; if (o.dataset.o === x.p) o.classList.add('ok'); }); if (!right) b.classList.add('ko');
      const mOpts = shuffle(x.fam.m.map(m => m[3])).slice(0, 4); if (!mOpts.includes(x.fr)) mOpts[0] = x.fr;
      $('#q2', box).innerHTML = `<p class="q">2. ${radInfo ? `La clé <span class="han">${radGlyph}</span> veut dire « ${esc(radInfo[2])} ».` : ''} De quoi parle-t-il ?</p>

      $$('#o2 .opt', box).forEach(b2 => b2.addEventListener('click', () => {
        const r2 = b2.dataset.o === x.fr; if (r2) { got++; score++; }

        S.detect[x.c] = Math.max(S.detect[x.c] || 0, got); save();
        speak(x.c);

          <span><span class="han" style="font-size:1.3rem">${x.c}</span> se lit <strong class="t${toneOf(x.p)}">${x.p}</strong> et veut dire « ${esc(x.fr)} » : clé ${esc(x.rad)} pour le sens, ${x.fam.ph} pour le son.</span>
          <button class="btn inkbtn" id="cont">${i + 1 < pool.length ? 'Caractère suivant →' : 'Terminer →'}</button></div>`;
        $('#cont', box).addEventListener('click', () => { i++; step(); });
      }));

}

// ---------- Séance du jour ----------
const perDayMinutes = () => S.goal.mode === 'day' ? S.goal.minutes : Math.max(5, Math.round(S.goal.minutes / Math.max(1, S.goal.days.length)));
const daysAway = () => S.lastStudy ? dayNum() - dayNum(new Date(S.lastStudy + 'T12:00')) : 0;
function dueSorted() { return dueWords().sort((a, b) => (S.srs[a.id].due - S.srs[b.id].due) || (S.srs[a.id].b - S.srs[b.id].b)); }
function nextChunk() {
  for (const L of lessonOrder().filter(l => l.l >= (S.level || 1)).concat(lessonOrder())) {
    const cs = chunksOf(L); const i = cs.findIndex((_, k) => !chunkDone(L, k));
    if (i >= 0) return {L, i, words: cs[i]};
  }
  return null;
}
function buildSeance() {

const GOAL_LEVEL = {conversation: 2, voyage: 2, hsk1: 1, hsk2: 2, hsk3: 3, hsk4: 4, lire: 3, series: 4, ecrire: 3};
const HORIZON_DAYS = {'3m': 91, '6m': 182, '1a': 365};
function planFor(minPerDay = perDayMinutes()) {
  const target = GOAL_LEVEL[S.profile?.goal] || 2;
  const total = WORDS.filter(w => w.l <= target).length, known = learned().length;
  const studyDays = S.goal.mode === 'day' ? S.goal.days.length : 7;
  const perDay = Math.max(1, minPerDay * 0.35) * studyDays / 7; // environ 1 mot nouveau pour 3 minutes, révisions comprises
  const days = Math.ceil(Math.max(0, total - known) / perDay);
  const date = new Date(); date.setDate(date.getDate() + days);
  const hz = HORIZON_DAYS[S.profile?.horizon];
  const need = hz ? Math.ceil(Math.max(0, total - known) / hz * 7 / studyDays / 0.35 / 5) * 5 : null;
  return {target, total, known, days, date, hz, need};
}

const SYL = new RegExp(`(?:zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])?[${VOW}]+(?:ng(?![${VOW}])|n(?![${VOW}])|r(?![${VOW}]))?`, 'gi');
const syls = p => p.split(/[\s'’\-]+/).flatMap(t => t.match(SYL) || []);

// La page est en français ; tout passage en chinois reçoit lang="zh-CN", pour que les lecteurs d'écran

document.documentElement.lang = 'fr';
const HAS_ZH = /[㐀-鿿豈-﫿]/;
const ZH_ONLY = /^[\s　-〿㐀-鿿豈-﫿＀-￯·…—0-9]+$/;
const ZH_RUN = /[㐀-鿿豈-﫿][㐀-鿿豈-﫿　-〿＀-￯·…]*/g;
const NO_TAG = 'script,style,svg,textarea,select,input,[lang="zh-CN"]';
function tagZh(root) {
  if (root.nodeType !== 1 || root.closest(NO_TAG)) return;
  // 1. Les éléments entièrement en chinois
  for (const el of [root, ...root.querySelectorAll('*')]) {
    if (el.closest(NO_TAG) || !HAS_ZH.test(el.textContent)) continue;
    if (ZH_ONLY.test(el.textContent.trim())) el.setAttribute('lang', 'zh-CN');
  }
  // 2. Le chinois glissé dans une phrase en français : on l'entoure d'un <span lang="zh-CN">
  const todo = [], walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  while (walk.nextNode()) { const n = walk.currentNode; if (HAS_ZH.test(n.data) && !n.parentElement?.closest(NO_TAG)) todo.push(n); }
  for (const n of todo) {
    const frag = document.createDocumentFragment(); let last = 0;
    n.data.replace(ZH_RUN, (m, i) => {
      if (i > last) frag.append(n.data.slice(last, i));
      const sp = document.createElement('span'); sp.lang = 'zh-CN'; sp.textContent = m; frag.append(sp);
      last = i + m.length; return m;
    });
    if (last < n.data.length) frag.append(n.data.slice(last));
    n.replaceWith(frag);
  }
}
new MutationObserver(ms => {
  for (const m of ms) for (const n of m.addedNodes) {
    if (n.nodeType === 1) tagZh(n);
    else if (n.nodeType === 3 && n.parentElement && HAS_ZH.test(n.data)) tagZh(n.parentElement);
  }
}).observe(document.body, {childList: true, subtree: true});

function vTest() {
  let lvl = 1, i = 0, score = 0, answers = [];
  flow(true);
  const s = view(`<button class="btn ghost small quit" data-go="accueil">✕ Quitter</button><div class="head"><span class="label">Test de niveau</span><h1>Où en es-tu ?</h1><p>5 questions par niveau. Avec 4 bonnes réponses sur 5, tu passes au niveau suivant. Pas de stress : « Je ne sais pas » est une réponse honnête.</p></div><div class="quiz" id="tq"></div>`);
  const box = $('#tq', s); wire(s);
  const step = () => {
    const qs = PLACEMENT.filter(q => q.l === lvl);
    if (i >= qs.length) {
      answers.push({l: lvl, score});
      if (score >= 4 && lvl < 4) { lvl++; i = 0; score = 0; return step(); }
      return finish(score >= 4 && lvl === 4);
    }
    const q = qs[i]; const opts = shuffle(q.o);
    const title = {mean: 'Que signifie ce mot ?', pick: q.q, listen: 'Écoute et choisis ce que tu entends', sent: 'Complète la phrase'}[q.k];
    box.innerHTML = `
      <div class="row" style="justify-content:space-between"><span class="label">HSK ${lvl} · question ${i + 1} sur 5</span><span class="label">${answers.reduce((n, a) => n + 5, 0) + i + 1} / 20 max</span></div>
      <div class="progress"><i style="width:${(i) / 5 * 100}%"></i></div>
      <div class="card prompt">
        <span class="q">${esc(title)}</span>
        ${q.k === 'mean' ? `<span class="h">${q.q}</span>` : ''}
        ${q.k === 'listen' ? `<button class="btn primary" data-say="${q.q}">${SPEAK_ICON} Écouter</button>` : ''}
        ${q.k === 'sent' ? `<span class="han" style="font-size:1.5rem">${esc(q.q.split(' (')[0])}</span><span class="muted">(${esc(q.q.split(' (')[1] || '')}</span>` : ''}
      </div>
      <div class="options">${opts.map(o => `<button class="opt ${/[一-鿿]/.test(o) ? 'hanopt' : ''}" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <div class="row" style="justify-content:center"><button class="btn ghost" id="idk">Je ne sais pas</button></div>`;
    if (q.k === 'listen') setTimeout(() => speak(q.q), 300);
    const next = ok => { if (ok) score++; i++; setTimeout(step, 650); };
    $$('.opt', box).forEach(b => b.addEventListener('click', () => {
      const ok = b.dataset.o === q.o[0];
      $$('.opt', box).forEach(x => { x.disabled = true; if (x.dataset.o === q.o[0]) x.classList.add('ok'); });
      if (!ok) b.classList.add('ko');
      next(ok);
    }));
    $('#idk', box).addEventListener('click', () => next(false));
  };
  const finish = allPassed => {
    const passed = answers.filter(a => a.score >= 4).map(a => a.l);
    const top = passed.length ? Math.max(...passed) : 0;
    const rec = Math.min(4, top + 1);
    S.level = rec; S.placement = {date: Date.now(), answers}; addXP(30);
    const msg = allPassed ? 'Tu maîtrises les bases du HSK 4. Les leçons HSK 4 te permettront de consolider, et l\'onglet Actus te propose de vraies lectures.'
      : top === 0 ? 'Tu démarres : parfait, les leçons HSK 1 sont faites pour toi. Commence par « Saluer et se présenter ».'
      : `Tu as validé le HSK ${top}. On continue avec le HSK ${rec}, et le quiz de révision gardera ton acquis en mémoire.`;
    box.innerHTML = `
      <div class="card prompt"><span class="label">Résultat</span><span class="h" style="font-family:var(--f-brush);color:var(--c-text)">HSK ${rec}</span><p class="q">${msg}</p></div>
      <div class="stack">${answers.map(a => `<div class="row" style="justify-content:space-between"><span>HSK ${a.l}</span><strong>${a.score} / 5 ${a.score >= 4 ? '· validé' : ''}</strong></div>`).join('')}</div>
      <div class="row" style="justify-content:center"><button class="btn primary" id="tgo">Voir mes leçons HSK ${rec}</button><button class="btn" data-go="objectifs">Régler mon objectif de temps</button></div>`;
    $('#tgo', box).addEventListener('click', () => { lessonLevel = rec; go('lecons'); });
    wire(box);
  };
  step();
}

// ---------- Quiz ----------
function makeQuestion(w, pool, kinds) {
  // Distracteurs sans doublon de sens, et sans homophone (他/她 se prononcent pareil)
  const bare = p => p.toLowerCase().replace(/[\s'\-]/g, '');
  const others = uniqBy(shuffle(pool.filter(x => x.h !== w.h && x.f !== w.f && bare(x.p) !== bare(w.p))), x => x.f);
  const k = pick(kinds.filter(k => k !== 'tone' || (w.h.length === 1 && toneOf(w.p) < 5)), 1)[0];
  const d = uniqBy(others, x => bare(x.p)).slice(0, 3);
  if (k === 'tone') return {w, k, prompt: 'Quel est le ton ?', show: w.h, opts: shuffle(['1er ton ā','2e ton á','3e ton ǎ','4e ton à']), ans: ['1er ton ā','2e ton á','3e ton ǎ','4e ton à'][toneOf(w.p) - 1], han: false};
  if (k === 'mean') return {w, k, prompt: 'Que signifie ce mot ?', show: w.h, opts: shuffle([w.f, ...d.map(x => x.f)]), ans: w.f, han: false};
  if (k === 'pinyin') return {w, k, prompt: 'Comment se prononce-t-il ?', show: w.h, opts: shuffle([w.p, ...d.map(x => x.p)]), ans: w.p, han: false};
  if (k === 'listen') return {w, k, prompt: 'Écoute et choisis le bon mot', show: null, opts: shuffle([w.h, ...d.map(x => x.h)]), ans: w.h, han: true};
  return {w, k: 'hanzi', prompt: `Comment écrit-on « ${w.f} » ?`, show: null, opts: shuffle([w.h, ...d.map(x => x.h)]), ans: w.h, han: true};
}

function runQuizIn(box, words, {title, n, kinds = ['mean','hanzi','pinyin','listen','tone'], lesson, timer, onDone}) {
  const pool = WORDS.filter(w => w.l === (words[0]?.l || 1));
  const items = onDone ? shuffle(words.slice(0, n)) : shuffle(words).slice(0, n); // séance : les plus urgents d'abord, puis dans le désordre

  const findWord = (q, o) => q.han ? W[o] : q.k === 'mean' ? WORDS.find(x => x.f === o) : q.k === 'pinyin' ? WORDS.find(x => x.p === o) : null;
  const done = () => {
    clearInterval(tick);
    if (finished || !box.isConnected) return; // quiz déjà terminé, ou quitté en cours de route
    finished = true;
    const total = timer ? i : items.length;
    if (lesson) S.lessons[lesson] = Math.max(S.lessons[lesson] || 0, ok);
    addXP(ok * 5);
    if (onDone) return onDone(ok, total);
    box.innerHTML = `<div class="card prompt"><span class="label">${esc(title)} · terminé</span><span class="h" style="font-family:var(--f-display);font-weight:800">${ok} / ${total}</span>
      <p class="q">${ok === total ? 'Sans faute ! 太棒了！' : ok / Math.max(total, 1) >= .7 ? 'Très bien. Les mots ratés reviendront demain.' : 'On continue : les erreurs font partie de l\'apprentissage.'}</p><span class="muted">${ok} mot${ok > 1 ? 's' : ''} renforcé${ok > 1 ? 's' : ''} · ${knownChars()} caractères reconnus en tout</span></div>
      <div class="row" style="justify-content:center"><button class="btn primary" id="again">Recommencer</button><button class="btn" data-go="pratiquer">Pratiquer autre chose</button><button class="btn" data-go="accueil">Accueil</button></div>`;
    $('#again', box).addEventListener('click', () => { app.innerHTML = ''; runQuiz(words, {title, n, kinds, lesson, timer}); });
    wire(box);
  };
  const step = () => {
    if (finished || !box.isConnected) return clearInterval(tick);
    if (timer ? Date.now() >= end : i >= items.length) return done();
    const q = makeQuestion(items[i], pool.length > 6 ? pool : WORDS, kinds);
    box.innerHTML = `
      <div class="row" style="justify-content:space-between"><span class="label">${esc(title)}</span><span class="label" id="cnt">${timer ? `${Math.ceil((end - Date.now()) / 1000)} s · ${ok} pts` : `${i + 1} / ${items.length}`}</span></div>
      <div class="progress"><i style="width:${timer ? (1 - (end - Date.now()) / (timer * 1000)) * 100 : i / items.length * 100}%"></i></div>
      <div class="card prompt"><span class="q">${esc(q.prompt)}</span>
        ${q.show ? `<span class="h">${q.show}</span>` : ''}
        ${q.k === 'listen' ? `<button class="btn primary" data-say="${q.w.h}">${SPEAK_ICON} Réécouter</button>` : ''}
      </div>
      <div class="options">${q.opts.map(o => `<button class="opt ${q.han ? 'hanopt' : ''}" data-o="${esc(o)}">${q.k === 'pinyin' ? pyHTML(o) : esc(o)}</button>`).join('')}</div>
      <div id="fbk"></div>`;
    if (q.k === 'listen') setTimeout(() => speak(q.w.h), 250);
    const nextQ = () => { i++; step(); };
    if (timer) {
      $$('.opt', box).forEach(b => b.addEventListener('click', () => {
        const right = b.dataset.o === q.ans; if (right) ok++; grade(q.w.id, right);
        $$('.opt', box).forEach(x => { x.disabled = true; if (x.dataset.o === q.ans) x.classList.add('ok'); }); if (!right) b.classList.add('ko');
        setTimeout(nextQ, right ? 400 : 1000);
      }));
    } else answerHandler(box, q.ans, q.w, right => { if (right) ok++; grade(q.w.id, right); }, nextQ, o => findWord(q, o));
  };
  if (timer) tick = setInterval(() => { const c = $('#cnt', box); if (c) c.textContent = `${Math.max(0, Math.ceil((end - Date.now()) / 1000))} s · ${ok} pts`; if (Date.now() >= end) done(); }, 250);
  step();
}

      }

  });

}

        $('.zh', h).textContent = r.texte || ''; $('.py', h).textContent = r.pinyin || ''; $('.tr', h).textContent = r.traduction || '';
        $('.say', h).innerHTML = speakBtn(r.texte || '', 'le texte');
        (r.vocab || []).forEach(v => { const d = document.createElement('div'); d.className = 'word'; d.innerHTML = `<span class="h"></span><div class="stack" style="gap:0"><span class="p"></span><span class="f"></span></div>`; $('.h', d).textContent = v.h; $('.p', d).textContent = v.p; $('.f', d).textContent = v.f; d.insertAdjacentHTML('beforeend', speakBtn(v.h)); $('.voc', h).append(d); });
        out.append(h); addXP(5);
      } catch (err) {
        out.innerHTML = `<p class="muted">${err?.code === 'not_granted' ? "L'accès à Claude n'a pas été autorisé pour cette page." : err?.code === 'rate_limited' ? 'Trop de demandes, réessaie dans une minute.' : 'Le texte n\'a pas pu être généré, réessaie.'}</p>`;
      }
      btn.disabled = false;
    });
  });
}

// ---------- Objectifs et rappels ----------
let downloadsNs; const downloadsReady = (async () => { try { downloadsNs = await window.claude?.use?.('downloads'); } catch {} return downloadsNs; })();
function vGoals() {
  const g = S.goal, r = S.reminder;
  const keys = weekKeys(), mins = keys.map(minutesOn);
  const perDay = g.mode === 'day' ? g.minutes : Math.round(g.minutes / Math.max(1, g.days.length));
  const max = Math.max(perDay * 1.25, ...mins, 5);
  const gp = goalProgress();
  const s = view(`
    <div class="head"><span class="label">Moi</span><h1>Ton rythme et tes réglages</h1><p>Le temps se compte tout seul quand tu fais une leçon, un quiz, un atelier ou une devinette (pauses de plus de 90 secondes exclues).</p></div>
    <div class="card stack">
      <div class="row" style="justify-content:space-between"><h2>Cette semaine</h2><span class="pill">${gp.done} / ${gp.target} min ${gp.unit}</span></div>
      <div class="chart" role="img" aria-label="Minutes étudiées par jour cette semaine">
        <div class="goal" style="bottom:${perDay / max * 100}%"><span>objectif ${perDay} min/j</span></div>
        ${mins.map((m, k) => `<div class="col"><div class="bar ${m < perDay ? 'under' : ''}" style="height:${m / max * 100}%"></div><span class="tip">${DAYS_FR[k]} : ${m} min</span></div>`).join('')}
      </div>
      <div class="xlabels">${keys.map((k, i) => `<span class="${k === dayKey() ? 'today' : ''}">${DAYS_FR[i]}</span>`).join('')}</div>
      ${mins.every(m => !m) ? '<span class="muted" style="font-size:.9rem;text-align:center">Pas encore de temps d\'étude cette semaine : lance une leçon ou un quiz, le compteur démarre tout seul.</span>' : ''}
      <span class="muted" style="font-size:.85rem">Barre pleine : objectif du jour atteint. Barre claire : en dessous. Série actuelle : ${streakAlive() ? S.streak : 0} jour${S.streak > 1 ? 's' : ''} ; les jours hors de ton planning comptent comme du repos et ne la cassent pas.</span>
    </div>
    <form class="card settings" id="gf">
      <h2>Objectif de temps</h2>
      <div class="field"><span class="label">Je compte en</span><div class="seg" role="group"><button type="button" data-mode="day" aria-pressed="${g.mode === 'day'}">Par jour</button><button type="button" data-mode="week" aria-pressed="${g.mode === 'week'}">Par semaine</button></div></div>
      <div class="field"><label class="label" for="gm">Durée : <span id="gmv">${g.minutes}</span> min ${g.mode === 'day' ? 'par jour' : 'par semaine'}</label>
        <input type="range" id="gm" min="${g.mode === 'day' ? 5 : 30}" max="${g.mode === 'day' ? 90 : 600}" step="5" value="${g.minutes}"></div>
      <div class="field"><span class="label">Jours d'étude</span><div class="days" id="gd">${DAYS_FR.map((d, k) => `<button type="button" data-d="${k}" aria-pressed="${g.days.includes(k)}" aria-label="${d}">${d[0]}</button>`).join('')}</div></div>
      <div class="field"><span class="label">Pinyin</span><div class="seg" role="group"><button type="button" data-py="show" aria-pressed="${S.pinyin === 'show'}">Visible</button><button type="button" data-py="tap" aria-pressed="${S.pinyin === 'tap'}">Au toucher</button><button type="button" data-py="hide" aria-pressed="${S.pinyin === 'hide'}">Caché</button></div>
        <span class="muted" style="font-size:.88rem">« Au toucher » floute le pinyin : ton œil lit d'abord le caractère, et tu touches pour vérifier. Tu peux aussi changer ce réglage depuis le bouton « Pinyin » en haut.</span></div>
      <div class="field"><span class="label">Tons</span><div class="seg" role="group"><button type="button" data-tc="color" aria-pressed="${S.tones === 'color'}">Couleurs</button><button type="button" data-tc="line" aria-pressed="${S.tones === 'line'}">Couleurs + traits</button><button type="button" data-tc="off" aria-pressed="${S.tones === 'off'}">Sans</button></div>
        <span class="muted tone-legend" style="font-size:.88rem"><span class="t1">mā 1er</span> · <span class="t2">má 2e</span> · <span class="t3">mǎ 3e</span> · <span class="t4">mà 4e</span> · <span class="t5">ma neutre</span>. Couleurs choisies pour rester distinctes en cas de daltonisme ; « + traits » ajoute un soulignement différent par ton.</span></div>
      <div class="field"><label class="label" for="rate">Vitesse de la voix : <span id="ratev">${S.rate}</span>×</label><input type="range" id="rate" min="0.5" max="1.2" step="0.1" value="${S.rate}"></div>
    </form>
    <div class="card stack">
      <h2>Rappels</h2>
      <p class="muted">Choisis l'heure et les jours : Xué Yuán crée un événement récurrent à ajouter à ton agenda (Calendrier Apple, Google Agenda, Outlook). Ton téléphone te préviendra à l'heure dite, même application fermée.</p>
      <div class="row"><label class="label" for="rt">Heure</label><input type="time" id="rt" value="${r.time}"></div>
      <div class="days" id="rdays">${DAYS_FR.map((d, k) => `<button type="button" data-d="${k}" aria-pressed="${r.days.includes(k)}" aria-label="${d}">${d[0]}</button>`).join('')}</div>
      <div class="row"><button class="btn primary" id="ics">Ajouter le rappel à mon agenda</button></div>
      <pre class="ai-out" id="icsout" hidden style="font-size:.78rem;overflow-x:auto"></pre>
    </div>
    <div class="card stack">
      <h2>Mon profil</h2>
      <p class="muted">${S.profile?.reasons?.length ? 'J\'apprends pour : ' + S.profile.reasons.map(k => lc((REASONS.find(r => r[0] === k) || [, , k])[2])).join(', ') + '.' : 'Questionnaire pas encore rempli.'}
        ${S.profile?.goal ? `<br>Mon but : ${esc(lc(goalLabel(S.profile.goal)))}.` : ''}</p>
      <div class="row"><button class="btn" id="redo-onb">Refaire le questionnaire</button></div>
    </div>
    <div class="card stack">
      <h2>Ma progression</h2>
      <p class="muted">${S.level ? `Niveau conseillé : HSK ${S.level}. ` : ''}${learned().length} mots vus, ${mastered()} maîtrisés, ${knownChars()} caractères reconnus, ${Object.keys(S.written).length} tracés dont ${Object.keys(S.recall).length} de mémoire.</p>
      <div class="row"><button class="btn" data-go="test">Refaire le test de niveau</button><button class="btn ghost" id="reset">Tout remettre à zéro</button></div>
      <p class="muted" id="resetc" hidden>Confirmer l'effacement de toute ta progression ? <button class="btn accent small" id="resety">Oui, effacer</button> <button class="btn small" id="resetn">Annuler</button></p>
    </div>`);
  wire(s);
  $$('[data-mode]', s).forEach(b => b.addEventListener('click', () => {
    const m = b.dataset.mode; if (m === g.mode) return;
    g.mode = m; g.minutes = m === 'day' ? Math.min(90, Math.max(5, Math.round(g.minutes / Math.max(1, g.days.length) / 5) * 5)) : Math.min(600, g.minutes * Math.max(1, g.days.length));
    save(); render('objectifs');
  }));
  $$('[data-tc]', s).forEach(b => b.addEventListener('click', () => { S.tones = b.dataset.tc; save(); header(); render('objectifs'); }));
  $$('[data-py]', s).forEach(b => b.addEventListener('click', () => { S.pinyin = b.dataset.py; save(); header(); render('objectifs'); }));
  $('#gm', s).addEventListener('input', e => { g.minutes = +e.target.value; $('#gmv', s).textContent = g.minutes; });
  $('#gm', s).addEventListener('change', () => { save(); render('objectifs'); });
  $('#rate', s).addEventListener('input', e => { S.rate = +e.target.value; $('#ratev', s).textContent = S.rate; });
  $('#rate', s).addEventListener('change', () => { save(); speak('你好，我们开始学习吧'); });
  const dayToggle = (sel, arr) => $(sel, s).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return; const d = +b.dataset.d;
    const i = arr.indexOf(d); if (i >= 0) { if (arr.length > 1) arr.splice(i, 1); } else arr.push(d);
    arr.sort(); b.setAttribute('aria-pressed', arr.includes(d)); save();
  });
  dayToggle('#gd', g.days); dayToggle('#rdays', r.days);
  $('#rt', s).addEventListener('change', e => { r.time = e.target.value || '19:00'; save(); });
  $('#ics', s).addEventListener('click', async () => {
    const ics = buildICS();
    const dl = await downloadsReady;
    if (dl) {
      try { await dl.save({filename: 'rappel-chinois.ics', data: ics}); toast('Ouvre le fichier pour l\'ajouter à ton agenda.'); return; }
      catch (e) { if (e?.code === 'declined' || e?.code === 'cancelled') return; }
    }
    const pre = $('#icsout', s); pre.hidden = false; pre.textContent = ics;
    toast('Copie ce texte dans un fichier .ics pour l\'importer.');
  });
  $('#redo-onb', s).addEventListener('click', () => onboarding(0));
  $('#reset', s).addEventListener('click', () => { $('#resetc', s).hidden = false; });
  $('#resetn', s).addEventListener('click', () => { $('#resetc', s).hidden = true; });
  $('#resety', s).addEventListener('click', () => { S = structuredClone(DEFAULT); save(); header(); go('accueil'); toast('Progression effacée.'); });
}
function buildICS() {
  const r = S.reminder, by = ['MO','TU','WE','TH','FR','SA','SU'];
  const [hh, mm] = r.time.split(':');
  const start = new Date(); start.setHours(+hh, +mm, 0, 0);
  for (let k = 0; k < 8 && !(r.days.includes((start.getDay() + 6) % 7) && start > new Date()); k++) start.setDate(start.getDate() + 1);
  const f = d => `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}T${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}00`;
  const per = S.goal.mode === 'day' ? S.goal.minutes : Math.round(S.goal.minutes / Math.max(1, S.goal.days.length));
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Xue Yuan//FR','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    `UID:xue-yuan-${Date.now()}@claude.ai`, `DTSTAMP:${stamp}`, `DTSTART:${f(start)}`, `DURATION:PT${per}M`,
    `RRULE:FREQ=WEEKLY;BYDAY=${r.days.map(d => by[d]).join(',')}`,
    `SUMMARY:学中文 · ${per} min de chinois`, 'DESCRIPTION:Ouvre Xué Yuán : révisions\\, leçon du jour et un caractère à écrire.',
    'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:PT0M','DESCRIPTION:C\'est l\'heure de réviser ton chinois','END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
}

// Navigation : 4 onglets (barre latérale sur ordinateur avec les sous-rubriques, barre du bas sur mobile)
const NAV = [['accueil', "Aujourd'hui", ['seance','test']], ['apprendre', 'Apprendre', ['lecons','ecriture','origines','memo','actus']], ['pratiquer', 'Pratiquer', ['quiz','detective','confusions','chansons','devinettes']], ['objectifs', 'Moi', []]];
const SUBNAMES = {lecons: 'Leçons', ecriture: 'Écriture', origines: 'Origines', memo: 'Mémo', actus: 'Actus', quiz: 'Révisions et quiz', detective: 'Détective', confusions: 'Confusions', chansons: 'Chansons', devinettes: 'Devinettes'};
const navItem = ([v, t], cls = 'navlink') => { const [col, g] = SECTION[v]; return `<a class="${cls}" href="#${v}" data-nav="${v}" ${tint(col)}><span class="g" aria-hidden="true">${g}</span>${t}</a>`; };
$('#sidenav').innerHTML = NAV.map(n => navItem(n) + (n[2].filter(v => SUBNAMES[v]).length ? `<div class="subnav">${n[2].filter(v => SUBNAMES[v]).map(v => `<a href="#${v}" data-nav="${v}" ${tint(SECTION[v][0])}>${SUBNAMES[v]}</a>`).join('')}</div>` : '')).join('');
$('#bottomnav').innerHTML = NAV.map(n => navItem(n, '')).join('');
document.addEventListener('click', e => {
  const a = e.target.closest('[data-nav]'); if (a) { e.preventDefault(); if (a.dataset.nav === 'seance') seance = null; go(a.dataset.nav); }
});

// ---------- Démarrage ----------
// Lot 2 : les « Séries » du HSK 2 (2-1 … 2-7) deviennent des unités thématiques (2a … 2j).
// Les mots déjà appris restent dans les révisions ; un paquet dont tous les mots sont déjà appris compte comme fait.
function migrateUnits() {
  const old = [...new Set([...Object.keys(S.chunks), ...Object.keys(S.lessons)].filter(k => /^2-\d+$/.test(k)))];
  if (!old.length) return;
  old.forEach(k => { delete S.chunks[k]; delete S.lessons[k]; });
  for (const L of LESSONS.filter(l => l.l === 2)) chunksOf(L).forEach((ws, i) => {
    if (ws.every(w => S.srs[w.id])) { const a = S.chunks[L.id] = S.chunks[L.id] || []; if (!a.includes(i)) a.push(i); }
  });
  save();
}
migrateUnits();
header(); route();
if (!S.onboarded) onboarding(0);
addEventListener('keydown', e => { if (e.key === 'Enter' && document.activeElement?.tagName !== 'INPUT') $('#cont')?.click(); });

</script>
